name: Build Clean Your TV

# Builds the two APKs in clean-your-tv/ on GitHub's computers:
#   clean-your-tv-phone.apk  -> install on your phone
#   clean-home-tv.apk        -> the ad-free home screen (the phone app installs it on the TV for you)
# Run it from the Actions tab, or it runs on every push that changes clean-your-tv/.
on:
  workflow_dispatch:
  push:
    paths:
      - "clean-your-tv/**"
      - ".github/workflows/build-clean-your-tv.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clean-your-tv
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          # The action's default list includes the retired "tools" package, which no longer exists.
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # Same signing key on every build, so new APKs install as updates (see clean-your-tv/signing/README.md).
      - name: Use your own signing key, if you added one as a secret
        env:
          CYT_KEYSTORE_BASE64: ${{ secrets.CYT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$CYT_KEYSTORE_BASE64" ]; then
            printf '%s' "$CYT_KEYSTORE_BASE64" | base64 -d > signing/clean-your-tv.keystore
            echo "Signing with the CYT_KEYSTORE_BASE64 key."
          fi

      - name: Otherwise keep the debug key between builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: clean-your-tv-debug-keystore

      - name: Test the TV profile and safety rules
        run: gradle --no-daemon :core:test

      - name: Build Clean Home (TV)
        run: gradle --no-daemon :tvhome:assembleDebug
        env:
          CYT_KEYSTORE_PASSWORD: ${{ secrets.CYT_KEYSTORE_PASSWORD }}

      - name: Bundle Clean Home inside the phone app
        run: cp tvhome/build/outputs/apk/debug/tvhome-debug.apk phone/src/main/assets/clean-home.apk

      - name: Build Clean Your TV (phone)
        run: gradle --no-daemon :phone:assembleDebug
        env:
          CYT_KEYSTORE_PASSWORD: ${{ secrets.CYT_KEYSTORE_PASSWORD }}

      - name: Name the APKs
        run: |
          mkdir -p out
          cp phone/build/outputs/apk/debug/phone-debug.apk out/clean-your-tv-phone.apk
          cp tvhome/build/outputs/apk/debug/tvhome-debug.apk out/clean-home-tv.apk

      - uses: actions/upload-artifact@v4
        with:
          name: clean-your-tv-apks
          path: clean-your-tv/out/*.apk
